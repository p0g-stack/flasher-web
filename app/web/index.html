<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Turn a full OTA into a ready-to-use flasher package in your browser.">
  <meta name="theme-color" content="#F3F6FC">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Flasher Builder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flasher Builder</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // manifest.json's file_handlers deliver OTA ZIPs opened from the OS (or
    // from Chrome's "Open with") as FileSystemFileHandles. Register the
    // consumer before Flutter starts, and keep every handle in a queue the
    // Dart side can drain once its UI is ready: the launch event has no
    // listener yet at this point.
    (function () {
      window.flasherLaunchFiles = window.flasherLaunchFiles || [];

      function publish(files) {
        if (!files || files.length === 0) return;
        for (var i = 0; i < files.length; i++) {
          window.flasherLaunchFiles.push(files[i]);
        }
        window.dispatchEvent(
          new CustomEvent('flasher-launch-files', { detail: files })
        );
      }

      if ('launchQueue' in window && 'setConsumer' in window.launchQueue) {
        window.launchQueue.setConsumer(function (launchParams) {
          publish(launchParams && launchParams.files);
        });
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // app_sw.js replaces Flutter's self-unregistering stub service worker. It
    // caches the app shell and never sees /api/ or Range requests.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('app_sw.js').catch(function (error) {
          console.warn('Service worker registration failed:', error);
        });
      });
    }
  </script>
</body>
</html>
