name: flasher_web
description: The flasher_web GUI. Flutter on top of the core.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  dynamic_color: ^2.1.0
  material_ui: ^1.0.0
  squadron: ^7.4.4
  web: ^1.1.0
  http: ^1.6.0
  flasher_web_core: any
  dir_picker: ^0.8.0
  file_picker: ^13.3.2
  file_picker_web: ^4.2.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web_usb_grant:
    path: ../packages/web_usb_grant

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
