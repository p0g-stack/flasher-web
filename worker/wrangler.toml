name = "flasher-web"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[assets]
binding = "ASSETS"
directory = "../app/build/web"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
OTA_S3_REGION = "garage"
# Set OTA_S3_ENDPOINT, OTA_S3_BUCKET and OTA_PUBLIC_BASE for your Garage.
# OTA_S3_ACCESS_KEY_ID and OTA_S3_SECRET_ACCESS_KEY are Worker secrets.

[triggers]
crons = ["* * * * *"]
