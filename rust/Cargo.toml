[workspace]
# The reusable crates live beside the app crate. The root package remains a
# member, so `cargo test --workspace` exercises all of it from rust/.
members = ["crates/fastboot-link", "crates/ota-payload"]
resolver = "2"

[package]
name = "flasher_web_native"
version = "0.1.0"
edition = "2021"
publish = false

# A library only: the app's Dart CLI is its one command line, and it calls
# this crate through frb. Never add a [[bin]] target.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The version at frb 848e438, the commit core/pubspec.yaml pins. tool/rust.sh
# patches it (rust/.cargo/config.toml) to flutter_p0g's patched frb, or to
# that commit when the patched one is not built.
flutter_rust_bridge = { version = "=2.14.0-beta.2", default-features = false, features = [
    # frb's defaults without thread-pool: single-threaded wasm (no COOP/COEP).
    "anyhow", "dart-opaque", "log", "portable-atomic", "rust-async", "user-utils", "wasm-start",
] }
sha2 = "0.10"
# Pure-Rust deflate (miniz_oxide) and CRC-32: both compile to wasm.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
# Payload operation codecs live in the reusable crate; gzip stream decoding
# stays app-local in api/payload.rs.
anyhow = "1"
miniz_oxide = "0.9"
ota-payload = { path = "crates/ota-payload" }
# Native USB / browser WebUSB fastboot transport, shared with the CLI through
# this crate's thin frb shim.
fastboot-link = { path = "crates/fastboot-link" }
# Session handles are serialized with an async mutex that works on wasm too.
futures = "0.3"

# Local proof branch only: merge after nusb releases the WebUSB evidence and
# lifecycle APIs, replacing this patch with the released minimum version.
[patch.crates-io]
nusb = { path = "/home/vivy/Projects/tools/nusb" }
